<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>からだの記録 レポート</title>
  <meta name="description" content="医師に見せるための期間レポート。PCで開いて印刷し、PDFに保存する。">
  <link rel="icon" href="icons/bear.svg" type="image/svg+xml">
  <style>
    /* 印刷前提のレポート。配色は dataviz の参照パレット(ライト)に合わせる。 */
    :root {
      --surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
      --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --border: rgba(11, 11, 11, 0.10);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; color: var(--ink); background: var(--page); font-size: 11pt; line-height: 1.45; }
    .controls { background: #fff; border-bottom: 1px solid var(--grid); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controls label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--ink-2); gap: 2px; }
    .controls input { font: inherit; padding: 6px 8px; border: 1px solid var(--axis); border-radius: 8px; }
    .controls button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--axis); background: #fff; cursor: pointer; font-weight: 600; }
    .controls button.primary { background: #F2B84B; border-color: #C98A17; }
    .controls .note { font-size: 0.85rem; color: var(--muted); flex-basis: 100%; }
    .page { background: var(--surface); max-width: 210mm; margin: 16px auto; padding: 14mm 14mm; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 16pt; margin: 0 0 4px; }
    .meta { color: var(--ink-2); font-size: 9.5pt; margin-bottom: 10px; display: flex; gap: 16px; flex-wrap: wrap; }
    h2 { font-size: 11.5pt; margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--grid); color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    th, td { padding: 3px 6px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
    th { color: var(--ink-2); font-weight: 600; font-size: 8.5pt; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.c, th.c { text-align: center; }
    .summary th { width: 32%; text-align: left; vertical-align: top; }
    .summary td { font-weight: 600; }
    .summary small { color: var(--ink-2); font-weight: 500; }
    .chart { position: relative; margin: 4px 0 2px; }
    .chart svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; gap: 16px; font-size: 9pt; color: var(--ink-2); margin: 0 0 4px; align-items: center; }
    .legend .key { display: inline-flex; align-items: center; gap: 6px; }
    .legend .sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; position: relative; }
    .legend .sw::after { content: ""; position: absolute; left: 6px; top: -5px; width: 8px; height: 8px; background: currentColor; border-radius: 50%; }
    .legend .sw.sq::after { border-radius: 1px; }
    .tooltip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; font-size: 9pt; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; white-space: nowrap; }
    .cal { table-layout: fixed; }
    .cal th { text-align: center; }
    .cal td { height: 54px; padding: 2px 4px; border: 1px solid var(--grid); font-size: 8.5pt; }
    .cal .d { color: var(--muted); font-size: 8pt; }
    .cal .sym { font-size: 12pt; line-height: 1; margin-right: 4px; vertical-align: middle; }
    .cal .t { color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .cal .out { background: #f3f3f0; }
    .leg { font-size: 8.5pt; color: var(--ink-2); margin-top: 4px; }
    .memos li { margin: 2px 0; }
    .empty { color: var(--muted); font-size: 9.5pt; }
    .avoid { break-inside: avoid; }
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      body { background: #fff; }
      .controls { display: none; }
      .page { box-shadow: none; margin: 0; padding: 0; max-width: none; }
      .tooltip { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>開始日 <input type="date" id="from"></label>
    <label>終了日 <input type="date" id="to"></label>
    <button id="apply">表示</button>
    <button id="print" class="primary">印刷 / PDF に保存</button>
    <span class="note">印刷ダイアログで「送信先: PDF に保存」を選ぶとPDFになります。用紙はA4縦。</span>
  </div>
  <div id="page" class="page"><p class="empty">読み込んでいます…</p></div>
  <script src="config.js"></script>
  <script src="report.js"></script>
</body>
</html>
